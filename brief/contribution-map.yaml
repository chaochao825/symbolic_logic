primary_claim:
  text: "For finite, repeated local predicate computation, GateBeam can recover compact Boolean structure; an oracle local Boolean predicate plus a symbolic solver demonstrates the intended local-versus-global division of labor."
  status: verified
  falsified_if: "Gate synthesis cannot recover a compact local rule, argmax hardening changes the controlled fixed-wiring proxy's clean/OOD decisions materially, or oracle local-predicate plus BFS fails on the constructed long-path setting."
secondary_claims:
  - text: "For the controlled fixed-wiring soft-gate proxy, argmax hardening preserves local OOD accuracy and graph-level BFS accuracy; this does not establish end-to-end no-drop under perceptual grounding noise."
    status: verified
  - text: "Bit-packed execution reduces storage and may accelerate repeated Boolean predicate evaluation, but packing and sparse-index construction can dominate at small batches."
    status: verified
  - text: "A fixed-depth AND/OR reachability circuit fails on paths longer than its unrolling depth, whereas an oracle local Boolean predicate plus BFS does not have that depth bound."
    status: verified
  - text: "Hard decisions discard uncertainty and are sensitive to predicate-grounding errors."
    status: verified
  - text: "A looped state-transition engine recovers variable-length cyclic reachability that fixed K-step unrolling misses, at a measured query-time cost."
    status: verified
  - text: "Random-LUT and parity scaling expose different failure modes: sampled random LUTs show no compositional holdout generalization, while parity has an O(n) XAG representation that is not recovered by the current bounded GateBeam search; exact probability marginalization remains distinct from hard Boolean evaluation."
    status: verified
  - text: "A component-supervised neural encoder, temperature-scaled named predicates with measured ECE, learned soft/hardened edge gate, and symbolic reachability solver form a measured pixel-to-task gridworld pipeline with clean, correlated-occlusion, and size-OOD evaluation."
    status: verified
  - text: "Joint variable/operator selection, task-only rule/topology search, and unseen composition controls distinguish recovery of a known AND rule from bounded logic discovery."
    status: verified
  - text: "MCR2 log-det rate reduction can be measured alongside empirical code entropy and synthesized gate count, but the proxy is not assumed to equal literal codec bits or circuit complexity."
    status: verified
  - text: "Boolean Coding Rate Reduction and task/function Circuit-MDL have separately validated decodable accounting components: KT/Dirichlet representation codes, circuit/language codes, residual masks, and paid escape routes; this repository does not yet serialize them as one jointly optimized payload."
    status: verified
  - text: "An exhaustive formula catalog for all four-input Boolean functions can prove basis-relative minimum formula size and distinguish parity from the balanced-function population without relying on heuristic GateBeam counts."
    status: verified
  - text: "A route-coded multi-language MDL comparison can select ANF, threshold, approximate gates, or raw labels while paying for the selected language and residual errors; ROBDD is included as a costed candidate but does not win these benchmarks."
    status: verified
  - text: "The official hard DiffLogic-CA artifacts can be replayed as fixed-topology Boolean recurrent programs and checked against task semantics without conflating replay with retraining."
    status: verified
  - text: "A shared local CA rule amortizes its model description over space-time, while dynamic work still scales with updated cells, recurrent steps, and active gates."
    status: verified
  - text: "Exact local-rule recovery does not by itself solve collective CA tasks: density classification and synchronization require long-range coordination, while Boolean wavefront pathfinding exchanges a compact local update for iteration and state memory."
    status: verified
  - text: "CA description length must account separately for local rule or wiring, initial/boundary state, decoder, recurrence horizon, and trajectory or terminal residual."
    status: verified
  - text: "On the complete three-input function space, paid AIG/XAG/MIG-style formula bases have task-dependent exact formula size and retained-witness code differences; no single basis has universally shortest paid retained-witness code."
    status: verified
  - text: "In the audited external Hard-LGN rows, multiple hardening candidate classes are validation-selected and ABC preserves hard accuracy on every evaluated task-input set."
    status: audited_external
proposed_next_step:
  - text: "Jointly learn a paid hierarchical representation-and-basis route while keeping combinatorial residuals, raw codec escape, and runtime confidence fallback distinct."
    status: proposed
non_claims:
  - "Logic gates replace first-order reasoning, variable binding, recursion, or general planning."
  - "CPU NumPy timings imply FPGA/ASIC power or latency."
  - "A gate-level graph is automatically a human-readable explanation."
  - "Looped gates remove the memory, control, search, or arithmetic cost of recursion, planning, proof search, probability, or perception."
  - "Rendered gridworld evidence establishes natural-image grounding, task-only end-to-end learning, learned sparse routing, or learned-gate-to-RTL compilation."
  - "A larger MCR2 objective value necessarily means fewer stored bits, fewer Boolean gates, or lower hardware cost."
  - "Minimum formula-tree gate count is minimum DAG/AIG size, FPGA LUT count, ASIC area, or a language-independent property."
  - "A heuristic synthesis result or an almost-all counting theorem proves a lower bound for one particular random LUT."
  - "Official frozen-circuit replay is equivalent to reproducing the original optimization trajectory or multi-seed training success rate."
  - "A small local CA rule guarantees small state, few recurrent steps, or low total task cost."
  - "DiffLogic-CA learns the Moore neighborhood, wiring topology, or a minimum Boolean circuit."
  - "Parity is representation-incompressible merely because the current GateBeam search fails to recover it."
risks:
  - "Synthetic Boolean rules may favor Boolean methods; report a random-LUT negative control."
  - "A sparse filter that evaluates every pair remains O(N^2); separate logical filtering from candidate generation."
  - "An oracle circuit may outperform learned gates; distinguish learning cost from compiled execution."
  - "Training-data shortcut features can yield compact but semantically wrong circuits."
  - "A local transition benchmark may hide compounding rollout error; report first divergence and full-trajectory accuracy."
  - "Published active-gate counts omit architecture, wiring, pass-through, state, and control costs; keep them separate from MDL and hardware claims."
