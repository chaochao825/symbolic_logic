[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afts-arc"
version = "0.1.0"
description = "Evidence and evaluation spine for an ARC functional-transition solver"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
usrl = ["torch>=2.2"]
metareasoning-audit = ["numpy==2.1.3", "scikit-learn==1.6.1"]

[project.scripts]
afts-arc = "afts_arc.cli:main"
afts-arc-hybrid = "afts_arc.functional_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["trash"]
